<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4D7CFE" />

    <!-- Font and connection hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" />
    </noscript>

    <!-- Critical shell styles for no-JS/slow-JS first paint -->
    <style>
      html, body {
        margin: 0;
        background: #020617;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      #boot-hero {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 96px 24px 48px;
        text-align: center;
        background:
          radial-gradient(1200px at 20% 20%, rgba(37,99,235,0.22), transparent 45%),
          radial-gradient(900px at 80% 25%, rgba(34,197,94,0.1), transparent 42%),
          #020617;
      }
      #boot-hero h1 {
        margin: 0 0 16px;
        font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      #boot-hero p {
        margin: 0 auto;
        max-width: 720px;
        color: #c7ced9;
        font-size: clamp(1rem, 2.2vw, 1.2rem);
      }
      .boot-emphasis {
        color: #8bb5ff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section id="boot-hero" aria-label="Elite Digital Solutions Hero">
        <div>
          <h1>
            We Don’t Just Build Websites.
            <span class="boot-emphasis"> We Build Revenue-Driven Businesses.</span>
          </h1>
          <p>
            High-performance websites, AI automation, and growth systems designed to help your business scale.
          </p>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
